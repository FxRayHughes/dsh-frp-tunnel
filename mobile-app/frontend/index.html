<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
    <meta name="color-scheme" content="dark"/>
    <title>DSH Remote</title>
    <link rel="stylesheet" href="/src/style.css"/>
</head>
<body>
<main class="shell">
    <header class="head">
        <div class="logo" aria-hidden="true">D</div>
        <div>
            <h1>DSH Remote</h1>
            <p class="muted">P2P 直连电脑上的 DeepSeek Harness，不通时经 FRP 隧道</p>
        </div>
    </header>

    <section id="connecting" class="card center" hidden>
        <div class="spinner" aria-hidden="true"></div>
        <p id="connecting-text">正在连接…</p>
        <button id="cancel" class="ghost" type="button">取消，修改设置</button>
    </section>

    <form id="settings" class="card" autocomplete="on">
        <label>
            <span>服务器地址</span>
            <input id="server" name="server" type="url" inputmode="url" autocapitalize="none" spellcheck="false"
                   placeholder="https://dsh.example.com" required/>
        </label>
        <label>
            <span>用户名</span>
            <input id="user" name="user" autocomplete="username" autocapitalize="none" spellcheck="false" required/>
        </label>
        <label>
            <span>密码</span>
            <div class="pw">
                <input id="password" name="password" type="password" autocomplete="current-password" required/>
                <button id="reveal" class="icon" type="button" aria-label="显示密码">👁</button>
            </div>
        </label>
        <label class="check">
            <input id="auto" type="checkbox"/>
            <span>启动时自动连接</span>
        </label>
        <label class="check">
            <input id="p2p" type="checkbox"/>
            <span>优先 P2P 直连（不通时经服务器中转，再不行走公网地址）</span>
        </label>

        <p id="status" class="status" role="status" aria-live="polite"></p>

        <div class="row">
            <button id="test" class="ghost" type="button">测试</button>
            <button id="connect" class="primary" type="submit">连接</button>
        </div>
        <button id="forget" class="link" type="button">清除已保存的设置</button>
    </form>

    <p class="foot muted">在 DSH 页面里按返回键会逐页后退；退到头再按一次即回到本设置页。</p>
</main>

<!-- Native form post: the WebView itself follows the relay's 303 to the current
     token link and keeps the gate + DSH cookies in its own cookie store. -->
<form id="login" method="post" hidden>
    <input name="user"/>
    <input name="password"/>
</form>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
